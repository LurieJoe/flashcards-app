<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body{margin:0;background:#0f172a;color:#e5e7eb;font-family:-apple-system,Segoe UI,Roboto,sans-serif}
  .wrap{max-width:760px;margin:0 auto;padding:28px 20px 48px}
  h1{font-size:20px;font-weight:700;margin:0 0 4px}
  .sub{color:#94a3b8;font-size:13px;margin:0 0 26px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
  .tile{background:#111827;border:1px solid #1f2937;border-radius:16px;padding:16px;text-align:center}
  .tile svg{width:150px;height:150px;filter:drop-shadow(0 8px 18px rgba(0,0,0,.35));border-radius:34px}
  .name{margin:12px 0 2px;font-size:14px;font-weight:700}
  .desc{color:#94a3b8;font-size:12px;line-height:1.4}
  .mini{margin-top:14px}
  .mini svg{width:56px;height:56px;border-radius:13px}
</style></head>
<body><div class="wrap">
  <h1>Mascot options</h1>
  <p class="sub">Current vs. two new directions. Bottom row shows each at in-app size.</p>

  <svg width="0" height="0"><defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>

    <!-- A: current turtle -->
    <symbol id="a" viewBox="0 0 512 512">
      <rect width="512" height="512" rx="120" fill="url(#g)"/>
      <g transform="translate(126,330) rotate(-36)">
        <rect x="-28" y="-58" width="56" height="116" rx="15" fill="#e2e6fb"/>
        <rect x="-16" y="-38" width="34" height="7" rx="3.5" fill="#c4c8ef"/>
        <rect x="-16" y="-22" width="24" height="7" rx="3.5" fill="#c4c8ef"/>
      </g>
      <path d="M104 262 l-30 -6 6 30 z" fill="#cfd4f7"/>
      <g transform="translate(320,206) rotate(30)">
        <rect x="-30" y="-64" width="60" height="128" rx="16" fill="#eef0ff"/>
        <rect x="-18" y="-44" width="36" height="7" rx="3.5" fill="#c4c8ef"/>
        <rect x="-18" y="-28" width="26" height="7" rx="3.5" fill="#c4c8ef"/>
      </g>
      <ellipse cx="214" cy="256" rx="130" ry="100" transform="rotate(-11 214 256)" fill="#cfd4f7"/>
      <ellipse cx="206" cy="244" rx="112" ry="82" transform="rotate(-11 214 256)" fill="#e6e9fb"/>
      <path d="M150 168 q-2 90 8 168 M214 158 q0 96 2 176 M280 172 q6 84 -2 158" stroke="#b9bff0" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M104 236 q112 -34 226 4" stroke="#b9bff0" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M312 250 q40 -8 66 -34 q22 20 6 44 q-30 24 -74 22 z" fill="#e6e9fb"/>
      <g transform="translate(292,354) rotate(44)">
        <rect x="-34" y="-76" width="68" height="152" rx="18" fill="#f6f7fe"/>
        <rect x="-20" y="-54" width="44" height="8" rx="4" fill="#c4c8ef"/>
        <rect x="-20" y="-34" width="30" height="8" rx="4" fill="#c4c8ef"/>
        <rect x="-20" y="-14" width="38" height="8" rx="4" fill="#c4c8ef"/>
      </g>
      <ellipse cx="392" cy="196" rx="42" ry="37" transform="rotate(-18 392 196)" fill="#eef0ff"/>
      <circle cx="404" cy="186" r="7.5" fill="#3b3591"/><circle cx="407" cy="182" r="2.6" fill="#fff"/>
      <path d="M404 214 q16 6 26 -4" stroke="#3b3591" stroke-width="6" fill="none" stroke-linecap="round"/>
      <circle cx="374" cy="204" r="8" fill="#f9a8c9" opacity=".65"/>
    </symbol>

    <!-- B: swimming / in-motion turtle -->
    <symbol id="b" viewBox="0 0 512 512">
      <rect width="512" height="512" rx="120" fill="url(#g)"/>
      <!-- motion streaks (behind, lower-left) -->
      <path d="M70 300 q54 -12 104 -6" stroke="#ffffff" stroke-width="10" fill="none" stroke-linecap="round" opacity=".28"/>
      <path d="M60 246 q56 -14 108 -8" stroke="#ffffff" stroke-width="9" fill="none" stroke-linecap="round" opacity=".20"/>
      <path d="M84 352 q48 -8 92 -2" stroke="#ffffff" stroke-width="8" fill="none" stroke-linecap="round" opacity=".16"/>
      <!-- bubbles -->
      <circle cx="96" cy="150" r="9" fill="#fff" opacity=".22"/>
      <circle cx="126" cy="120" r="6" fill="#fff" opacity=".18"/>
      <circle cx="72" cy="112" r="5" fill="#fff" opacity=".15"/>
      <!-- turtle, tilted nose-up as if gliding forward -->
      <g transform="rotate(-13 256 256) translate(6 4)">
        <g transform="translate(126,330) rotate(-52)">
          <rect x="-26" y="-54" width="52" height="108" rx="14" fill="#e2e6fb"/>
          <rect x="-15" y="-36" width="32" height="7" rx="3.5" fill="#c4c8ef"/>
          <rect x="-15" y="-21" width="22" height="7" rx="3.5" fill="#c4c8ef"/>
        </g>
        <path d="M104 262 l-30 -6 6 30 z" fill="#cfd4f7"/>
        <g transform="translate(322,200) rotate(48)">
          <rect x="-30" y="-64" width="60" height="128" rx="16" fill="#eef0ff"/>
          <rect x="-18" y="-44" width="36" height="7" rx="3.5" fill="#c4c8ef"/>
          <rect x="-18" y="-28" width="26" height="7" rx="3.5" fill="#c4c8ef"/>
        </g>
        <ellipse cx="214" cy="256" rx="130" ry="100" transform="rotate(-11 214 256)" fill="#cfd4f7"/>
        <ellipse cx="206" cy="244" rx="112" ry="82" transform="rotate(-11 214 256)" fill="#e6e9fb"/>
        <path d="M150 168 q-2 90 8 168 M214 158 q0 96 2 176 M280 172 q6 84 -2 158" stroke="#b9bff0" stroke-width="5" fill="none" stroke-linecap="round"/>
        <path d="M104 236 q112 -34 226 4" stroke="#b9bff0" stroke-width="5" fill="none" stroke-linecap="round"/>
        <path d="M312 250 q40 -8 66 -34 q22 20 6 44 q-30 24 -74 22 z" fill="#e6e9fb"/>
        <g transform="translate(296,360) rotate(60)">
          <rect x="-34" y="-76" width="68" height="152" rx="18" fill="#f6f7fe"/>
          <rect x="-20" y="-54" width="44" height="8" rx="4" fill="#c4c8ef"/>
          <rect x="-20" y="-34" width="30" height="8" rx="4" fill="#c4c8ef"/>
          <rect x="-20" y="-14" width="38" height="8" rx="4" fill="#c4c8ef"/>
        </g>
        <ellipse cx="392" cy="196" rx="42" ry="37" transform="rotate(-18 392 196)" fill="#eef0ff"/>
        <circle cx="404" cy="186" r="7.5" fill="#3b3591"/><circle cx="407" cy="182" r="2.6" fill="#fff"/>
        <path d="M404 214 q16 6 26 -4" stroke="#3b3591" stroke-width="6" fill="none" stroke-linecap="round"/>
      </g>
    </symbol>

    <!-- C: minimalist smiley flashcard (refined, not childish) -->
    <symbol id="c" viewBox="0 0 512 512">
      <rect width="512" height="512" rx="120" fill="url(#g)"/>
      <!-- back card peeking (depth) -->
      <g transform="rotate(7 256 262)">
        <rect x="176" y="150" width="176" height="230" rx="26" fill="#c7ccf4"/>
      </g>
      <!-- front card -->
      <g transform="rotate(-5 256 262)">
        <rect x="150" y="132" width="212" height="268" rx="30" fill="#f7f8ff"/>
        <!-- header lines -->
        <rect x="182" y="170" width="120" height="12" rx="6" fill="#c4c8ef"/>
        <rect x="182" y="196" width="84" height="12" rx="6" fill="#d7daf4"/>
        <!-- minimalist face, lower-center -->
        <circle cx="222" cy="300" r="10" fill="#4f46e5"/>
        <circle cx="290" cy="300" r="10" fill="#4f46e5"/>
        <path d="M214 336 q42 34 84 0" stroke="#4f46e5" stroke-width="12" fill="none" stroke-linecap="round"/>
      </g>
    </symbol>
  </defs></svg>

  <div class="grid">
    <div class="tile"><svg><use href="#a"/></svg><div class="name">A — Current turtle</div><div class="desc">Steady swimmer, cards as flippers</div><div class="mini"><svg><use href="#a"/></svg></div></div>
    <div class="tile"><svg><use href="#b"/></svg><div class="name">B — Swimming turtle</div><div class="desc">Tilted glide + motion streaks &amp; bubbles</div><div class="mini"><svg><use href="#b"/></svg></div></div>
    <div class="tile"><svg><use href="#c"/></svg><div class="name">C — Smiley card</div><div class="desc">Clean monoline face, minimal &amp; grown-up</div><div class="mini"><svg><use href="#c"/></svg></div></div>
  </div>
</div></body></html>
